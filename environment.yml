# Reproducible SPECTRA environment (the tested H100 / CUDA 12-13 stack).
#   conda env create -f environment.yml && conda activate spectra && pip install -e .
name: spectra
channels: [conda-forge]
dependencies:
  - python=3.12
  - pip
  - pip:
    - torch>=2.5
    - transformers==5.11.0
    - datasets==3.6.0
    - numpy==2.2.6
    - matplotlib>=3.9
    # optional extras:
    # - lm-eval>=0.4
    # - triton>=3.0
