[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-kv"
version = "0.2.0"
description = "SPECTRA: training-free KV-cache compression by spectral transform coding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "transformers>=4.57,<6",
    "datasets>=2.18,<4",
    "numpy>=1.26",
]

[project.optional-dependencies]
eval = ["rouge", "fuzzywuzzy", "jieba"]          # LongBench metrics (official metrics.py)
ppl = ["lm-eval>=0.4"]
tools = ["matplotlib>=3.9"]

[tool.setuptools]
packages = ["spectra", "spectra.eval"]

[tool.setuptools.package-data]
"spectra.eval" = ["config/*.json"]
